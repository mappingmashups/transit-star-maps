<title>Transit Star Maps</title>
<!-- Old transitstarmaps.com addresses (Tumblr posts, tags, archive pages)
     and any other missing page land here and go to the home page. -->
<meta http-equiv="refresh" content="0; url=/">
<script>
  // Old Tumblr posts (/post/<id>/...) jump to their map's card.
  var posts = {"120301591440": "bart", "120301636190": "la_metro", "120301852490": "bc_skytrain", "134840215485": "montreal"};
  var m = location.pathname.match(/\/post\/(\d+)/);
  var anchor = m && posts[m[1]] ? "#" + posts[m[1]] : "";
  location.replace("/" + anchor);
</script>

  html { background: #05070d; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #ece8d9; font: 18px/1.5 Georgia, serif; text-align: center; padding: 16px; box-sizing: border-box; }
