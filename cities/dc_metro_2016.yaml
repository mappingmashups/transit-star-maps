# Metrorail from the 2016 project's data (github.com/benbalter/dc-maps), never
# rendered back then. Predates Silver Line phase 2 and Potomac Yard.
name: Metrorail (2016 data)
source:
  type: linework
  station_name_field: NAME
  stations: legacy/data/dc_metro/metro-stations.geojson
  lines: legacy/data/dc_metro/metro-lines.geojson
style:
  line_style: curved  # match the TileMill-era renders
  star_size_in: 0.14
  min_star_spacing_in: 0.13
