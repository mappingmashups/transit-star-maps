# The T: Red (with the Mattapan trolley), Orange, Blue and Green lines,
# including the Green Line Extension. The Silver Line (bus) and commuter rail
# stay out.
name: MBTA Subway
source:
  type: gtfs
  url: https://cdn.mbta.com/MBTA_GTFS.zip
  route_types: [0, 1]
style:
  star_size_in: 0.13
  min_star_spacing_in: 0.1
stations:
  # The B, C and E branches run in the street with small median stops (MBTA
  # puts them in their own fare areas: fares are paid on board). They're
  # drawn as small stars; the Central Subway, the D branch and the Green
  # Line Extension keep full stars.
  minor_areas: ["^area_green_[bce]_west_of"]
