<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{tagline}}">
<link rel="canonical" href="{{url}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{url}}">
<meta property="og:site_name" content="{{title}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{tagline}}">
<meta property="og:image" content="{{url}}social-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{card_alt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{tagline}}">
<meta name="twitter:image" content="{{url}}social-card.png">
<meta name="twitter:image:alt" content="{{card_alt}}">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sky" aria-hidden="true"><i class="s1"></i><i class="s2"></i></div>

<header class="wrap">
  <h1><span class="mark">★</span>{{title}}<span class="mark">★</span></h1>
  <p class="tagline">{{tagline}}</p>
  <p class="about">{{about}}</p>
  <p class="more"><a href="about/">About these maps &amp; FAQ</a></p>
</header>

<main class="wrap">
  <section class="grid" aria-label="Maps">
{{cards}}
  </section>
{{shop_all}}
</main>

<footer>
  <div class="wrap">
    <span>Station locations from the transit agencies' published data. {{copyright}}</span>
    <nav aria-label="Links">{{links}}</nav>
  </div>
</footer>

<dialog id="viewer" aria-labelledby="viewer-title">
  <img alt="">
  <div class="dialog-bar">
    <h2 id="viewer-title"></h2>
    <div class="actions">
      <a class="button" data-shop target="_blank" rel="noopener">Buy or customize on Zazzle</a>
      <button class="button close" type="button">Close</button>
    </div>
  </div>
</dialog>

<script>
  const viewer = document.getElementById("viewer");
  const img = viewer.querySelector("img");
  const shop = viewer.querySelector("[data-shop]");
  document.querySelectorAll(".frame").forEach((frame) => {
    frame.addEventListener("click", () => {
      img.src = frame.dataset.src;
      img.alt = frame.querySelector("img").alt;
      viewer.querySelector("h2").textContent = frame.dataset.title;
      shop.hidden = !frame.dataset.shop;
      if (frame.dataset.shop) shop.href = frame.dataset.shop;
      viewer.showModal();
    });
  });
  viewer.querySelector(".close").addEventListener("click", () => viewer.close());
  viewer.addEventListener("click", (e) => { if (e.target === viewer) viewer.close(); });
</script>
</body>
</html>
