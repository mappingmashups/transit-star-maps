<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{tagline}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{tagline}}">
<meta property="og:image" content="{{og_image}}">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #05070d;
    --sky-2: #0b1020;
    --ink: #ece8d9;
    --muted: #9298ab;
    --star: #ffffaa;
    --line: rgba(236, 232, 217, 0.14);
    --serif: "Cormorant Garamond", Georgia, serif;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--sky); }
  body {
    margin: 0;
    color: var(--ink);
    font: 16px/1.6 var(--sans);
    background: radial-gradient(ellipse at 50% -20%, var(--sky-2), var(--sky) 70%) fixed;
    min-height: 100vh;
  }
  /* Background stars, generated by scripts/build_site.py */
  .sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .sky i { position: absolute; top: 0; left: 0; width: 1px; height: 1px; border-radius: 50%; background: transparent; }
  .sky .s1 { box-shadow: {{stars_small}}; opacity: .55; }
  .sky .s2 { width: 2px; height: 2px; box-shadow: {{stars_big}}; opacity: .7; animation: twinkle 7s ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity: .35; } to { opacity: .8; } }
  @media (prefers-reduced-motion: reduce) { .sky .s2 { animation: none; } }

  main, header, footer { position: relative; z-index: 1; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }

  header.wrap { padding-top: 72px; padding-bottom: 40px; text-align: center; }
  h1 {
    font: 600 clamp(2.4rem, 7vw, 4.4rem)/1 var(--serif);
    letter-spacing: .04em;
    margin: 0 0 14px;
  }
  h1 .mark { color: var(--star); font-size: .55em; vertical-align: .35em; margin: 0 .25em; }
  .tagline { font: italic 500 clamp(1.15rem, 2.6vw, 1.45rem)/1.35 var(--serif); color: var(--muted); margin: 0 auto 22px; max-width: 34em; }
  .about { max-width: 40em; margin: 0 auto; color: #c9c6b8; }
  .shop-all { display: inline-block; margin-top: 24px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr));
    gap: 28px;
    padding: 24px 0 72px;
  }
  .card { display: flex; flex-direction: column; }
  .frame {
    display: block; width: 100%;
    position: relative;
    aspect-ratio: 1;
    padding: 18px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: rgba(0, 0, 0, .55);
    cursor: zoom-in;
    transition: border-color .25s, box-shadow .25s;
  }
  .frame:hover, .frame:focus-visible { border-color: rgba(255, 255, 170, .45); box-shadow: 0 0 40px rgba(255, 255, 170, .08); outline: none; }
  .frame img { position: absolute; inset: 18px; width: calc(100% - 36px); height: calc(100% - 36px); object-fit: contain; }
  .caption { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 14px 2px 0; }
  .place { font: 600 1.6rem/1.15 var(--serif); margin: 0; }
  .system { font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 4px 0 0; }
  .note { font-size: .85rem; color: var(--muted); margin: 6px 0 0; }

  .button {
    flex: none;
    font: 500 .78rem/1 var(--sans); letter-spacing: .12em; text-transform: uppercase;
    color: var(--star); text-decoration: none;
    border: 1px solid rgba(255, 255, 170, .5); border-radius: 999px;
    padding: 9px 16px;
    transition: background .2s, color .2s;
  }
  .button:hover, .button:focus-visible { background: var(--star); color: var(--sky); outline: none; }

  dialog {
    width: min(96vw, 1100px); max-height: 94vh;
    padding: 0; border: 1px solid var(--line); border-radius: 8px;
    background: var(--sky); color: var(--ink);
  }
  dialog::backdrop { background: rgba(2, 3, 8, .85); }
  dialog img { display: block; width: 100%; max-height: calc(94vh - 80px); object-fit: contain; padding: 24px; }
  .dialog-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; border-top: 1px solid var(--line); }
  .dialog-bar h2 { font: 600 1.4rem/1.2 var(--serif); margin: 0; }
  .dialog-bar .actions { display: flex; gap: 10px; }
  .close { background: none; cursor: pointer; }

  footer { border-top: 1px solid var(--line); padding: 28px 0 48px; color: var(--muted); font-size: .9rem; }
  footer .wrap { display: flex; flex-wrap: wrap; gap: 12px 28px; justify-content: space-between; }
  footer nav { display: flex; flex-wrap: wrap; gap: 8px 20px; }
  footer a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
  footer a:hover { border-color: var(--star); }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><i class="s1"></i><i class="s2"></i></div>

<header class="wrap">
  <h1><span class="mark">★</span>{{title}}<span class="mark">★</span></h1>
  <p class="tagline">{{tagline}}</p>
  <p class="about">{{about}}</p>
  {{shop_all}}
</header>

<main class="wrap">
  <section class="grid" aria-label="Maps">
{{cards}}
  </section>
</main>

<footer>
  <div class="wrap">
    <span>Station data from each agency's published GTFS feed. © {{year}} Transit Star Maps.</span>
    <nav aria-label="Links">{{links}}</nav>
  </div>
</footer>

<dialog id="viewer" aria-labelledby="viewer-title">
  <img alt="">
  <div class="dialog-bar">
    <h2 id="viewer-title"></h2>
    <div class="actions">
      <a class="button" data-shop target="_blank" rel="noopener">Shop</a>
      <button class="button close" type="button">Close</button>
    </div>
  </div>
</dialog>

<script>
  const viewer = document.getElementById("viewer");
  const img = viewer.querySelector("img");
  const shop = viewer.querySelector("[data-shop]");
  document.querySelectorAll(".frame").forEach((frame) => {
    frame.addEventListener("click", () => {
      img.src = frame.dataset.src;
      img.alt = frame.querySelector("img").alt;
      viewer.querySelector("h2").textContent = frame.dataset.title;
      shop.hidden = !frame.dataset.shop;
      if (frame.dataset.shop) shop.href = frame.dataset.shop;
      viewer.showModal();
    });
  });
  viewer.querySelector(".close").addEventListener("click", () => viewer.close());
  viewer.addEventListener("click", (e) => { if (e.target === viewer) viewer.close(); });
</script>
</body>
</html>
