# Maps shown on the website, in display order. After editing, run
#   .venv/bin/python scripts/build_site.py
# which copies each map's SVG into docs/ and rebuilds docs/index.html.
#
#   city:   a config name from cities/ (the map must already be rendered)
#   place:  big heading on the card
#   system: the transit system's name
#   shop:   product URL (Zazzle etc.); leave empty to hide the button
#   line_style: optional, "curved" or "straight" to override the city config
#   note:   optional one-liner shown under the system name

title: Transit Star Maps
# The site's public address, used for the social card and link previews.
# (GitHub Pages serves the site at this custom domain; see docs/CNAME.)
url: https://transitstarmaps.com/
# Old Tumblr post IDs -> map (city) to jump to. Any other old address
# (/tagged/..., /archive, unlisted maps) goes to the top of the page.
old_posts:
  "120301591440": bart          # transit-star-map-bart-sf-bay
  "120301636190": la_metro      # transit-star-map-la-metro
  "120301804435": trimet_max    # transit-star-map-max-portland
  "120301852490": bc_skytrain   # transit-star-map-skytrain-vancouver
  "134840128565": toronto       # transit-star-map-ttc-toronto-canada
  "134840215485": montreal      # transit-star-map-montréal-canada
# The map shown on the social card (docs/social-card.png).
card_map: bart
tagline: Subway and light rail networks, drawn as constellations.
about: >
  Every star is a station, placed where it really is, and lines join
  neighboring stations the way star charts draw constellations. Bigger stars
  mark the places where lines meet or branch. The result is a city's transit system as it might appear in
  the night sky.
shop_all: "https://www.zazzle.com/transitstarmaps"  # the whole store
# Footer credit.
author: Alan McConchie
author_url: https://mappingmashups.net
copyright_year: 2026
links:
  - {label: Instagram, url: ""}
  - {label: GitHub, url: "https://github.com/mappingmashups/transit-star-maps"}

