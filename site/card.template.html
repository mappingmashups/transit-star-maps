<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=IBM+Plex+Sans:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: radial-gradient(ellipse at 30% -10%, #121a33, #05070d 70%);
    color: #ece8d9;
  }
  .sky { position: absolute; inset: 0; }
  .sky i { position: absolute; top: 0; left: 0; width: 1px; height: 1px; border-radius: 50%; }
  .sky .s1 { box-shadow: {{stars_small}}; opacity: .5; }
  .sky .s2 { width: 2px; height: 2px; box-shadow: {{stars_big}}; opacity: .7; }
  .text { position: absolute; left: 72px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; }
  h1 { font: 600 88px/0.98 "Cormorant Garamond", Georgia, serif; letter-spacing: .02em; margin: 0 0 26px; }
  h1 .mark { color: #ffffaa; font-size: .45em; vertical-align: .5em; margin-left: .15em; }
  p { font: italic 500 32px/1.25 "Cormorant Garamond", Georgia, serif; color: #a9aec0; margin: 0 0 40px; }
  .caption { font: 500 17px/1 "IBM Plex Sans", sans-serif; letter-spacing: .16em; text-transform: uppercase; color: #ffffaa; }
  .map { position: absolute; right: 40px; top: 35px; width: 560px; height: 560px; }
  .map img { width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
  <div class="sky"><i class="s1"></i><i class="s2"></i></div>
  <div class="text">
    <h1>Transit<br>Star Maps<span class="mark">★</span></h1>
    <p>{{tagline}}</p>
    <div class="caption">{{caption}}</div>
  </div>
  <div class="map"><img src="{{map_src}}" alt=""></div>
</body>
</html>
